[project]
name = "alamos-ha"
version = "0.1.0"
description = "Hochverfügbarkeits-Wächter für Alamos-Alarmierung zwischen zwei Standorten (Tailscale-Failover, Kiosk-Dashboard)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.scripts]
alamos-ha = "alamos_ha.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
