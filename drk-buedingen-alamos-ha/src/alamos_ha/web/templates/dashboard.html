<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AlamosHA - {{ site_name }}</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --panel-border: #2a3550;
    --text: #eef2f9;
    --muted: #93a0b8;
    --ok: #2ea04b;
    --ok-bg: #123a20;
    --bad: #c0392b;
    --bad-bg: #3a1512;
    --warn: #e0a92a;
    --warn-bg: #3a2f10;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #conflict-banner {
    display: none;
    background: var(--bad);
    color: white;
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    padding: 14px;
    letter-spacing: 0.5px;
  }
  header {
    padding: 20px 32px 8px;
  }
  header h1 {
    margin: 0;
    font-size: 1.8rem;
  }
  header .subtitle {
    color: var(--muted);
    font-size: 1rem;
    margin-top: 4px;
  }
  main {
    padding: 16px 32px 32px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .tile .label {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 600;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 1.6rem;
    font-weight: 700;
    padding: 6px 0;
  }
  .pill .dot {
    width: 16px; height: 16px; border-radius: 50%;
    flex: none;
  }
  .pill.ok { color: var(--ok); }
  .pill.ok .dot { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
  .pill.bad { color: var(--bad); }
  .pill.bad .dot { background: var(--bad); box-shadow: 0 0 12px var(--bad); }
  .pill.warn { color: var(--warn); }
  .pill.warn .dot { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
  .tile .detail {
    color: var(--muted);
    font-size: 0.95rem;
  }
  .update-row {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 24px;
  }
  .controls {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 18px 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }
  button {
    background: #2a3550;
    color: var(--text);
    border: 1px solid #3c4a6b;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover { background: #344066; }
  label.switch {
    display: flex; align-items: center; gap: 8px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  #log {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 16px 22px;
    max-height: 220px;
    overflow-y: auto;
    font-family: Consolas, monospace;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #log div { padding: 2px 0; border-bottom: 1px solid #202a40; }
</style>
</head>
<body>
  <div id="conflict-banner">⚠ KONFLIKT ERKANNT - BITTE FÜHRUNGSGRUPPE/IT INFORMIEREN</div>

  <header>
    <h1>Alarmierungsüberwachungssystem - Status</h1>
    <div class="subtitle" id="site-name">Standort {{ site_name }}</div>
  </header>

  <main>
    <div class="grid">
      <div class="tile">
        <div class="label">Ich bin Master</div>
        <div class="pill" id="pill-master"><span class="dot"></span><span>-</span></div>
      </div>
      <div class="tile">
        <div class="label">Ich bin Standby</div>
        <div class="pill" id="pill-standby"><span class="dot"></span><span>-</span></div>
      </div>
      <div class="tile">
        <div class="label">Ich habe Internet</div>
        <div class="pill" id="pill-internet"><span class="dot"></span><span>-</span></div>
      </div>
      <div class="tile">
        <div class="label">Alamos läuft</div>
        <div class="pill" id="pill-alamos"><span class="dot"></span><span>-</span></div>
      </div>
      <div class="tile">
        <div class="label">Verbindung zum DE-Alarm-Handy</div>
        <div class="pill" id="pill-phone"><span class="dot"></span><span>-</span></div>
        <div class="detail" id="phone-detail"></div>
      </div>
    </div>

    <div class="update-row">Letzte Aktualisierung: <span id="last-update">-</span></div>

    <div class="controls">
      <button id="btn-master">Diese Seite zum Master machen</button>
      <button id="btn-standby">Diese Seite auf Standby setzen</button>
      <label class="switch">
        <input type="checkbox" id="chk-automatic" checked />
        Automatische Umschaltung aktiv
      </label>
    </div>

    <div id="log"></div>
  </main>

<script>
  function setPill(id, ok, textOk, textBad, warn) {
    const el = document.getElementById(id);
    el.classList.remove("ok", "bad", "warn");
    el.classList.add(warn ? "warn" : (ok ? "ok" : "bad"));
    el.querySelector("span:last-child").textContent = ok ? textOk : textBad;
  }

  function formatTimestamp(iso) {
    if (!iso) return "-";
    const d = new Date(iso);
    return d.toLocaleTimeString("de-DE") + " Uhr";
  }

  async function refresh() {
    let data;
    try {
      const res = await fetch("/api/status", { cache: "no-store" });
      data = await res.json();
    } catch (e) {
      document.getElementById("last-update").textContent = "Dashboard nicht erreichbar - erneuter Versuch...";
      return;
    }

    setPill("pill-master", data.is_master, "JA", "NEIN");
    setPill("pill-standby", data.is_standby, "JA", "NEIN");
    setPill("pill-internet", data.internet_ok, "JA", "NEIN");
    setPill("pill-alamos", data.alamos_running, "LÄUFT", "GESTOPPT");
    setPill("pill-phone", data.phone.connected, "VERBUNDEN", "NICHT VERBUNDEN", data.phone.state === "unauthorized");
    document.getElementById("phone-detail").textContent = data.phone.message;

    document.getElementById("last-update").textContent = formatTimestamp(data.last_update) + " - " + data.last_message;
    document.getElementById("chk-automatic").checked = data.automatic_enabled;

    const banner = document.getElementById("conflict-banner");
    banner.style.display = (data.last_kind === "conflict") ? "block" : "none";

    const log = document.getElementById("log");
    log.innerHTML = "";
    for (const entry of data.log) {
      const line = document.createElement("div");
      const t = new Date(entry.timestamp).toLocaleTimeString("de-DE");
      line.textContent = `[${t}] ${entry.message}`;
      log.appendChild(line);
    }
  }

  document.getElementById("btn-master").addEventListener("click", async () => {
    if (!confirm("Diesen Standort jetzt manuell zum Master machen? Dadurch wird hier der Alamos-Dienst gestartet. Nur bestätigen, wenn sichergestellt ist, dass der andere Standort NICHT gleichzeitig ebenfalls alarmiert.")) return;
    await fetch("/api/force-role", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: "master" }) });
    refresh();
  });

  document.getElementById("btn-standby").addEventListener("click", async () => {
    if (!confirm("Diesen Standort jetzt manuell auf Standby setzen? Dadurch wird hier der Alamos-Dienst gestoppt.")) return;
    await fetch("/api/force-role", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ role: "standby" }) });
    refresh();
  });

  document.getElementById("chk-automatic").addEventListener("change", async (e) => {
    await fetch("/api/automatic", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: e.target.checked }) });
  });

  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
